# Integración continua gratuita (RNF-29, RNF-33): lanza el lint y los tests en cada push y pull request.
# No usa credenciales de Google: los tests simulan Sheets, Drive, Calendar y Mail (ADR-0015).
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependencias de desarrollo
        run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Tests unitarios y de endpoints
        run: npm test
      - name: Cobertura
        run: TZ=Europe/Madrid node --test --experimental-test-coverage "tests/**/*.test.js"
      - name: Navegador para los E2E
        run: npx playwright install --with-deps chromium
      - name: Tests E2E de la interfaz (escritorio y móvil)
        run: npm run test:e2e
