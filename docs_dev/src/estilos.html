<style>
  /* Tokens del sistema de diseño — ver docs_dev/solution/design-system.md (ADR-0011) */
  :root {
    --c-primary-50:#FBF1EC; --c-primary-100:#F6E0D5; --c-primary-300:#DD9A7B;
    --c-primary-500:#B5562E; --c-primary-600:#9A4727; --c-primary-700:#8E4322; --c-primary-900:#4F2412;
    --c-accent-50:#F2F4EC; --c-accent-100:#E2E8D4; --c-accent-500:#5E7C46; --c-accent-600:#4D6739; --c-accent-700:#3D522E;
    --c-success:#468144; --c-success-bg:#E6F2E6;
    --c-warning:#D08A1E; --c-warning-bg:#FBEFD9;
    --c-error:#B23A2E;   --c-error-bg:#F7E2DF;
    --c-info:#4A6D7C;    --c-info-bg:#E5EDF0;
    --c-badge-abierta:#7FD0F0; --c-badge-cerrada:#A6E08A; --c-badge-cancelada:#C9C2B8;
    --c-badge-cobro-si:#A6E08A; --c-badge-cobro-no:#F2A6A0;
    --c-bg:#FBF8F4; --c-surface:#FFFFFF; --c-surface-alt:#F5F0E9;
    --c-border:#ECE5DC; --c-border-strong:#D9CFC2;
    --c-text:#2A2420; --c-text-muted:#6E655C; --c-text-disabled:#A89E92;
    --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
    --space-5:24px; --space-6:32px; --space-7:48px; --space-8:64px;
    --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-pill:999px;
    --shadow-sm:0 1px 2px rgba(42,36,32,.06);
    --shadow-md:0 4px 12px rgba(42,36,32,.10);
    --shadow-lg:0 12px 32px rgba(42,36,32,.18);
    --font-head:"Poppins", system-ui, sans-serif;
    --font-body:"Inter", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    color: var(--c-text);
    background: var(--c-bg);
  }
  h1, h2, h3 { font-family: var(--font-head); margin: 0; }

  .app-header {
    display: flex; align-items: center; justify-content: space-between;
    gap: var(--space-4);
    padding: var(--space-4) var(--space-5);
    background: var(--c-surface);
    border-bottom: 1px solid var(--c-border);
  }
  .app-header .marca { display: inline-flex; align-items: center; gap: var(--space-3); font-weight: 600; font-size: 1.5rem; color: var(--c-primary-700); }
  .marca-icono { width: 36px; height: 36px; border-radius: var(--radius-md); }
  .marca-icono[src=""] { display: none; } /* sin Config.Icono_Url no se muestra nada (F-24) */
  .app-header .usuario { font-size: 0.875rem; color: var(--c-text-muted); }

  .contenedor { max-width: 960px; margin: 0 auto; padding: var(--space-5); }

  /* Navegación inferior fija, al alcance del pulgar (F-25). El cuerpo deja sitio para no tapar el contenido. */
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  body.con-subpiso { padding-bottom: calc(128px + env(safe-area-inset-bottom)); }
  .nav-inferior {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--c-surface); border-top: 1px solid var(--c-border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .nav-piso, .nav-subpiso { display: flex; justify-content: center; gap: var(--space-1); padding: var(--space-1) var(--space-2); }
  .nav-subpiso { border-bottom: 1px solid var(--c-border); background: var(--c-surface-alt); }
  .nav-subpiso[hidden], .nav-piso[hidden] { display: none; }
  .nav-item, .nav-sub {
    flex: 1 1 auto; max-width: 180px; min-height: 48px; border: 0; background: none; cursor: pointer;
    font-family: var(--font-body); font-weight: 600; color: var(--c-text-muted); border-radius: var(--radius-md);
  }
  .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: var(--space-1) 2px; font-size: 0.8125rem; }
  .nav-item[hidden] { display: none; }
  .nav-sub { padding: var(--space-2); font-size: 0.9375rem; }
  .nav-icono { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nav-item[aria-current="page"], .nav-sub[aria-current="page"] { color: var(--c-primary-700); background: var(--c-primary-50); }
  .nav-item:focus-visible, .nav-sub:focus-visible { outline: 2px solid var(--c-accent-500); outline-offset: -2px; }
  a.btn { display: inline-flex; align-items: center; text-decoration: none; }
  .btn {
    font-family: var(--font-body); font-weight: 600; font-size: 1rem;
    padding: 10px 16px; border-radius: var(--radius-md); min-height: 44px; /* área táctil (RNF-12) */
    border: 1px solid transparent; cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:focus-visible { outline: 2px solid var(--c-accent-500); outline-offset: 2px; }
  .btn-primario { background: var(--c-primary-500); color: #fff; }
  .btn-primario:hover { background: var(--c-primary-600); }
  .btn-primario:active { background: var(--c-primary-700); }
  .btn-secundario { background: transparent; color: var(--c-primary-700); border-color: var(--c-primary-500); }
  .btn-secundario:hover { background: var(--c-primary-50); }
  /* Estado desactivado (CLAUDE.md §6.4): gris y sin reacción, para que no parezca pulsable. */
  .btn:disabled, .btn:disabled:hover { background: var(--c-surface-alt); border-color: var(--c-border); color: var(--c-text-disabled); cursor: not-allowed; }
  .btn-pequeno { padding: 6px 12px; font-size: 0.85rem; min-height: 44px; }

  .seccion { display: none; }
  .seccion.activa { display: block; }

  .panel {
    background: var(--c-surface); border: 1px solid var(--c-border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
    padding: var(--space-5); margin-bottom: var(--space-5);
  }
  .panel h2 { font-size: 1.25rem; margin-bottom: var(--space-4); }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .02em;
    color: var(--c-text-muted); font-weight: 600;
    background: var(--c-surface-alt); padding: var(--space-3);
    border-bottom: 1px solid var(--c-border);
  }
  thead th.orden { cursor: pointer; user-select: none; }
  thead th.orden:hover { color: var(--c-primary-700); }
  tbody td { padding: var(--space-3); border-bottom: 1px solid var(--c-border); }
  tbody tr:hover { background: var(--c-primary-50); }

  .vacio { color: var(--c-text-muted); padding: var(--space-4); text-align: center; }
  .enlace-acento { color: var(--c-accent-700); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }

  /* Acceso denegado */
  .denegado { max-width: 480px; margin: 12vh auto; text-align: center; padding: var(--space-6); }
  .denegado .icono { font-size: 3rem; }
  .denegado h1 { font-size: 1.5rem; color: var(--c-primary-700); margin: var(--space-4) 0; }
  .denegado p { color: var(--c-text-muted); }

  /* Formulario */
  .form-grupo { margin-bottom: var(--space-4); }
  .form-grupo > label, .etiqueta-bloque {
    display: block; font-weight: 600; font-size: 0.9rem;
    margin-bottom: var(--space-2); color: var(--c-text);
  }
  .obligatorio { color: var(--c-error); }

  input[type="text"], input[type="tel"], input[type="email"], input[type="number"],
  input[type="date"], input[type="time"], select {
    width: 100%; font-family: var(--font-body); font-size: 1rem;
    padding: 11px var(--space-3); min-height: 44px;
    color: var(--c-text); background: var(--c-surface);
    border: 1px solid var(--c-border-strong); border-radius: var(--radius-md);
  }
  input:focus, select:focus {
    outline: 2px solid var(--c-accent-500); outline-offset: 1px;
    border-color: var(--c-accent-500);
  }
  textarea {
    width: 100%; font-family: var(--font-body); font-size: 1rem;
    padding: 11px var(--space-3); color: var(--c-text); background: var(--c-surface);
    border: 1px solid var(--c-border-strong); border-radius: var(--radius-md); resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--c-accent-500); outline-offset: 1px; border-color: var(--c-accent-500); }
  input[type="file"] { font-family: var(--font-body); font-size: 0.9rem; }
  input.invalido { border-color: var(--c-error); background: var(--c-error-bg); }

  /* F-28: registro de viajeros en SES */
  .viajeros { border-top: 1px solid var(--c-border); margin-top: var(--space-4); padding-top: var(--space-4); }
  .viajeros h3 { font-size: 1rem; margin-bottom: var(--space-2); }
  .viajeros > .btn-primario, .viajeros > #btn-comprobar-ses { width: 100%; margin-top: var(--space-3); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-2); }
  .chip { font-size: 0.8125rem; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--c-surface-alt); color: var(--c-text); }
  .chip.ok { background: #E8F3E8; color: #1E5E22; } .chip.av { background: #FFF4E0; color: #8A5200; }
  .chip.err { background: #FCE8E6; color: #A1221B; } .chip.info { background: #E6F0F7; color: #1F5F8B; }
  .aviso-viajeros { border-left: 4px solid var(--c-border); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); font-size: 0.9375rem; margin: var(--space-3) 0; }
  .aviso-viajeros.ok { border-color: #2E7D32; background: #E8F3E8; } .aviso-viajeros.av { border-color: #B26A00; background: #FFF4E0; }
  .aviso-viajeros.err { border-color: #B3261E; background: #FCE8E6; }
  .huesped { border: 1px solid var(--c-border); border-radius: var(--radius-md); padding: var(--space-3); margin-top: var(--space-3); background: var(--c-surface); }
  .huesped.validado { border-color: #B9DCB9; background: #F8FCF8; }
  .huesped .btn-primario { width: 100%; margin-top: var(--space-3); }
  .huesped select { width: 100%; margin-top: var(--space-2); }
  .fila-dato { display: flex; justify-content: space-between; gap: var(--space-2); font-size: 0.9375rem; padding: 2px 0; }
  .fila-dato > span:first-child { color: var(--c-text-muted); } .fila-dato > span:last-child { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  .fila-dato .doc { font-family: ui-monospace, Consolas, monospace; }
  .validado-por { color: #1E5E22; font-weight: 600; font-size: 0.875rem; margin: var(--space-2) 0 0; }
  .problema { display: block; color: #A1221B; font-weight: 600; font-size: 0.875rem; margin-top: var(--space-2); }

  /* F-29: ventana de "trabajando" (por debajo de los modales de error y confirmación) */
  .ocupado { position: fixed; inset: 0; z-index: 150; background: rgba(42,36,32,.35); display: flex; align-items: center; justify-content: center; padding: var(--space-4); }
  .ocupado[hidden] { display: none; }
  .ocupado-caja { background: var(--c-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: var(--space-5); text-align: center; max-width: 280px; }
  .ocupado-caja p { margin: var(--space-2) 0 0; color: var(--c-text-muted); font-size: 0.875rem; }
  .ocupado-rueda { width: 36px; height: 36px; margin: 0 auto var(--space-3); border-radius: 50%; border: 4px solid var(--c-primary-50); border-top-color: var(--c-primary-500); animation: girar 0.9s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ocupado-rueda { animation: none; } }

  /* Modal de confirmación */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(42,36,32,.45);
    display: flex; align-items: center; justify-content: center; z-index: 200; padding: var(--space-4);
  }
  .modal {
    background: var(--c-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
    padding: var(--space-5); max-width: 420px; width: 100%;
  }
  .modal h3 { margin-bottom: var(--space-3); }
  .modal p { color: var(--c-text-muted); margin: 0 0 var(--space-5); }
  .modal-error h3 { color: var(--c-error); }
  .modal-error { border-top: 4px solid var(--c-error); }
  .modal-aviso { border-top: 4px solid var(--c-warning); }

  /* Checklists (F-14) */
  details.checklist { border: 1px solid var(--c-border); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); background: var(--c-surface); }
  details.checklist summary { font-weight: 600; min-height: 44px; display: flex; align-items: center; cursor: pointer; }
  .checklist-bloque { margin: var(--space-4) 0 var(--space-2); font-size: 1rem; color: var(--c-primary-700); }
  .checklist-punto { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) 0; border-bottom: 1px solid var(--c-border); flex-wrap: wrap; }
  .checklist-control { display: flex; align-items: center; gap: var(--space-3); flex: 1 1 200px; min-height: 44px; }
  .checklist-control input[type="checkbox"] { width: 24px; height: 24px; flex: 0 0 auto; }
  .checklist-control label { cursor: pointer; }
  .checklist-danos { display: flex; align-items: center; flex-wrap: wrap; gap: var(--space-2) var(--space-3); border: 0; margin: 0; padding: 0; }
  .checklist-danos legend { width: 100%; padding: 0; }
  .checklist-danos input[type="radio"] { width: 24px; height: 24px; margin: 0; }
  .checklist-danos label { min-height: 44px; display: inline-flex; align-items: center; }
  .checklist-punto .texto-punto { flex: 1 1 200px; min-height: 44px; resize: vertical; }
  .checklist-punto.no-aplica label, .checklist-punto.no-aplica .texto-punto { color: var(--c-text-muted); text-decoration: line-through; }
  .btn-no-aplica[aria-pressed="true"] { background: var(--c-surface-alt); border-color: var(--c-text-muted); color: var(--c-text); }

  /* Estadísticas */
  .stats-zonas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--space-4); }
  .stat-card {
    background: var(--c-surface-alt); border: 1px solid var(--c-border);
    border-radius: var(--radius-md); padding: var(--space-4);
  }
  .stat-card h3 { font-size: 1rem; margin-bottom: var(--space-3); color: var(--c-primary-700); }
  .stat-card .stat-num { font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-card .stat-label { font-size: 0.8rem; color: var(--c-text-muted); }

  /* Badge de estado de reserva */
  .estado-badge {
    display: inline-block; padding: 3px 12px; border-radius: var(--radius-pill);
    font-size: 0.8rem; font-weight: 700; color: var(--c-text);
  }
  .estado-abierta   { background: var(--c-badge-abierta); }
  .estado-cerrada   { background: var(--c-badge-cerrada); }
  .estado-cancelada  { background: var(--c-badge-cancelada); }

  /* Datos de la reserva (solo lectura) en la pantalla de edición */
  .datos-reserva {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--space-3);
    background: var(--c-surface-alt); border: 1px solid var(--c-border);
    border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-4);
  }
  .datos-reserva > div { display: flex; flex-direction: column; gap: 2px; }
  .dato-etq { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .02em; color: var(--c-text-muted); font-weight: 600; }

  .tabla-scroll { overflow-x: auto; }
  .cobro-ingresado { background: var(--c-badge-cobro-si); }
  .cobro-no        { background: var(--c-badge-cobro-no); }

  /* DD-03 · Pantallas compactas para el móvil (F-35): menos aire, mismo sistema visual */
  .panel-compacto { padding: var(--space-4); }
  .panel-compacto h2 { margin-bottom: var(--space-3); }
  .form-grupo-compacto { max-width: 320px; margin-bottom: var(--space-3); }
  .filtros { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--space-3); }
  .filtros .form-grupo { margin-bottom: var(--space-3); }
  .filtros .form-grupo > label { font-size: 0.8125rem; margin-bottom: var(--space-1); }
  input[type="search"] {
    width: 100%; font-family: var(--font-body); font-size: 1rem; padding: 11px var(--space-3); min-height: 44px;
    color: var(--c-text); background: var(--c-surface); border: 1px solid var(--c-border-strong); border-radius: var(--radius-md);
  }
  .chips-filtro { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-bottom: var(--space-2); }
  .btn-chip {
    min-height: 44px; padding: 6px 14px; border-radius: var(--radius-pill); border: 1px solid var(--c-primary-500);
    background: var(--c-surface); color: var(--c-primary-700); font-family: var(--font-body); font-weight: 600; font-size: 0.875rem; cursor: pointer;
  }
  .btn-chip[aria-pressed="true"] { background: var(--c-primary-500); color: #fff; }
  .btn-chip:focus-visible, .btn-segmento:focus-visible, .tarjeta-reserva:focus-visible { outline: 2px solid var(--c-accent-500); outline-offset: 2px; }

  /* Tarjetas del listado (F-36): sin scroll lateral; toda la tarjeta abre la reserva */
  .lista-tarjetas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--space-2); }
  .tarjeta-reserva {
    width: 100%; min-height: 44px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
    padding: var(--space-3); border: 1px solid var(--c-border); border-radius: var(--radius-md); background: var(--c-surface);
    font-family: var(--font-body); font-size: 0.9375rem; color: var(--c-text);
  }
  .tarjeta-reserva:hover { background: var(--c-primary-50); border-color: var(--c-primary-300); }
  .tarjeta-titulo { font-weight: 600; overflow-wrap: anywhere; }
  .tarjeta-fechas { color: var(--c-text-muted); font-size: 0.875rem; }
  .tarjeta-etiquetas { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-1); }
  .paginacion { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin-top: var(--space-3); }
  .paginacion[hidden] { display: none; }
  .paginacion span { font-size: 0.875rem; color: var(--c-text-muted); }

  /* Ficha de la reserva (F-42) y cabecera de las pantallas de Reservas */
  .cabecera-pantalla { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); }
  .cabecera-pantalla .btn { flex: 0 0 auto; white-space: nowrap; }
  .cabecera-pantalla h2, .cabecera-pantalla h3 { margin: 0; font-size: 1.125rem; flex: 1 1 auto; overflow-wrap: anywhere; }
  .acciones-ficha { display: flex; gap: var(--space-2); flex-wrap: wrap; margin: var(--space-3) 0; }
  .acciones-ficha:empty { display: none; }
  .acciones-ficha .btn { flex: 1 1 auto; }
  .ficha-seccion { margin-top: var(--space-4); }
  .ficha-seccion > h3 { font-size: 0.95rem; margin-bottom: var(--space-2); }
  .ficha-seccion .datos-reserva { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: var(--space-3); margin-bottom: 0; gap: var(--space-3); }
  .dato-valor { overflow-wrap: anywhere; }
  .campo-ficha { display: flex; flex-direction: column; gap: var(--space-1); }
  .campo-ficha[hidden] { display: none; }
  .campo-ficha textarea { min-height: 88px; }
  .bloque-notas .campo-ficha { width: 100%; }
  .texto-notas { white-space: pre-wrap; margin: 0; }
  .servicio-linea { margin: 0; padding: var(--space-2) var(--space-3); background: var(--c-surface-alt); border: 1px solid var(--c-border); border-radius: var(--radius-md); }
  .servicio-item { flex-wrap: wrap; }
  .lista-historial { display: flex; flex-direction: column; gap: var(--space-2); }
  .historial-item { display: flex; flex-direction: column; padding: var(--space-2) 0; border-bottom: 1px solid var(--c-border); font-size: 0.875rem; }
  .historial-cuando { color: var(--c-text-muted); font-size: 0.8125rem; }
  .historial-que { overflow-wrap: anywhere; }

  /* Funciones de la barra de Reservas (F-38, F-39, F-41, F-43) */
  .segmentado { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-bottom: var(--space-3); }
  .segmentado[hidden] { display: none; }
  .btn-segmento {
    min-height: 48px; border-radius: var(--radius-md); border: 1px solid var(--c-primary-500); background: var(--c-surface);
    color: var(--c-primary-700); font-family: var(--font-body); font-weight: 700; font-size: 0.9375rem; cursor: pointer;
  }
  .btn-segmento[aria-pressed="true"] { background: var(--c-primary-500); color: #fff; }
  .propuesta { margin-bottom: var(--space-3); }
  .propuesta .dato-etq { display: block; margin-bottom: var(--space-1); }
  .btn-bloque { width: 100%; }
  .trabajo[hidden] { display: none; }
  .trabajo .viajeros { border-top: 0; margin-top: 0; padding-top: 0; }
