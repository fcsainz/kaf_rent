<script>
  // Navegación entre secciones (HTML Service no tiene enrutado nativo, ver ADR-0008).
  // Barra inferior (F-25, F-31): Gestionar y Crear cuelgan de "Reservas"; Checklists y Conexión SES, de "Admin".
  // F-33: en Gestionar, la ficha y las funciones, la barra general se cambia por la de Reservas.
  const SUBPISOS = {
    reservas: { secciones: ['gestionar', 'crear', 'ficha', 'funcion'], boton: 'btn-nav-reservas', piso: 'nav-subpiso-reservas' },
    admin: { secciones: ['checklists', 'conexion-ses'], boton: 'btn-nav-admin', piso: 'nav-subpiso-admin' },
  };
  const SECCIONES_BARRA_RESERVAS = ['gestionar', 'ficha', 'funcion'];

  // Otra pantalla puede frenar la navegación (p. ej. la ficha con cambios sin guardar, F-44):
  // devuelve true si se encarga ella y llamará a `continuar` cuando proceda.
  let guardiaNavegacion = null;

  const mostrarSubpiso = (nombre, visible) => {
    const { boton, piso } = SUBPISOS[nombre];
    $(piso).hidden = !visible;
    $(boton).setAttribute('aria-expanded', String(visible));
    const abierto = Object.values(SUBPISOS).some((x) => !$(x.piso).hidden);
    document.body.classList.toggle('con-subpiso', abierto);
  };

  const subpisoDe = (seccion) => Object.keys(SUBPISOS).find((n) => SUBPISOS[n].secciones.includes(seccion)) || null;

  const mostrarBarra = (seccion) => {
    const deReservas = SECCIONES_BARRA_RESERVAS.includes(seccion);
    $('nav-general').hidden = deReservas;
    $('nav-reservas').hidden = !deReservas;
    return deReservas;
  };

  const navegar = (seccion, { forzar = false } = {}) => {
    if (!forzar && guardiaNavegacion && guardiaNavegacion(seccion, () => navegar(seccion, { forzar: true }))) return;
    document.querySelectorAll('.seccion').forEach((s) => {
      s.classList.toggle('activa', s.id === 'seccion-' + seccion);
    });
    document.querySelectorAll('.btn-nav').forEach((b) => {
      if (b.dataset.seccion === seccion) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');
    });
    const deReservas = mostrarBarra(seccion);
    const subpiso = subpisoDe(seccion);
    Object.keys(SUBPISOS).forEach((n) => {
      if (n === subpiso && !deReservas) $(SUBPISOS[n].boton).setAttribute('aria-current', 'page');
      else $(SUBPISOS[n].boton).removeAttribute('aria-current');
      mostrarSubpiso(n, n === subpiso && !deReservas);
    });
    window.scrollTo(0, 0);
  };

  const alternarSubpiso = (nombre) => {
    const abrir = $(SUBPISOS[nombre].piso).hidden;
    Object.keys(SUBPISOS).forEach((n) => mostrarSubpiso(n, n === nombre && abrir));
  };

  const inicializarNavegacion = () => {
    document.querySelectorAll('.btn-nav').forEach((btn) => {
      btn.addEventListener('click', () => navegar(btn.dataset.seccion));
    });
    $('btn-nav-reservas').addEventListener('click', () => alternarSubpiso('reservas'));
    $('btn-nav-admin').addEventListener('click', () => alternarSubpiso('admin'));
    $('btn-nav-volver-inicio').addEventListener('click', () => navegar('inicio'));
    navegar('inicio');
    const btnCancelar = $('btn-cancelar-crear');
    if (btnCancelar) btnCancelar.addEventListener('click', () => navegar('inicio'));
  };

  // ----- Formulario Crear Reserva: catálogos en cascada y validación (ADR-0003, HU-08/09/12/13) -----
  const RE_TELEFONO = /^\d{9}$/;
  const RE_EMAIL = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  let espaciosCatalogo = [];
  let canalesCatalogo = [];
  let costeFijoCanal = 0;

  const $ = (id) => document.getElementById(id);

  // ----- F-29: ventana de "trabajando" -----
  // servidor('Guardando…').withSuccessHandler(…).withFailureHandler(…).metodo(…) se usa igual que google.script.run
  // y muestra la ventana mientras dura la llamada (solo si pasa de RETARDO_OCUPADO_MS, para que no parpadee).
  const RETARDO_OCUPADO_MS = 300;
  let llamadasEnCurso = 0;
  let temporizadorOcupado = null;

  const empezarOcupado = (texto) => {
    llamadasEnCurso += 1;
    $('ocupado-texto').textContent = texto;
    if (!temporizadorOcupado) temporizadorOcupado = setTimeout(() => { $('ocupado').hidden = llamadasEnCurso === 0; }, RETARDO_OCUPADO_MS);
  };

  const terminarOcupado = () => {
    llamadasEnCurso = Math.max(0, llamadasEnCurso - 1);
    if (llamadasEnCurso > 0) return;
    clearTimeout(temporizadorOcupado);
    temporizadorOcupado = null;
    $('ocupado').hidden = true;
  };

  const servidor = (texto) => {
    let alTerminarBien = () => {};
    let alFallar = () => {};
    const llamada = new Proxy({}, {
      get: (_, nombre) => {
        if (nombre === 'withSuccessHandler') return (f) => { alTerminarBien = f; return llamada; };
        if (nombre === 'withFailureHandler') return (f) => { alFallar = f; return llamada; };
        // RNF-13: un fallo al llamar o al pintar la respuesta nunca deja la ventana de "trabajando" abierta ni
        // pasa en silencio: se cierra la ventana y se muestra el error (con el nombre de la llamada, para soporte).
        return (...args) => {
          empezarOcupado(texto);
          const protegido = (manejador) => (valor) => {
            terminarOcupado();
            try { manejador(valor); } catch (error) { mostrarErrorInterno(nombre, error); }
          };
          try {
            google.script.run.withSuccessHandler(protegido(alTerminarBien)).withFailureHandler(protegido(alFallar))[nombre](...args);
          } catch (error) {
            terminarOcupado();
            mostrarErrorInterno(nombre, error);
          }
        };
      },
    });
    return llamada;
  };

  // Error inesperado de la interfaz: se cuenta en una ventana, con el detalle técnico para el administrador.
  const mostrarErrorInterno = (donde, error) => {
    const detalle = error && error.message ? error.message : String(error);
    const texto = `Algo ha fallado en la app (${donde}: ${detalle}). Recarga la página; si se repite, envía este mensaje al administrador.`;
    try { mostrarMensaje(texto, 'error'); } catch (e) { window.alert(texto); } // si falla antes de cargar la ventana de avisos
  };
  window.addEventListener('error', (evento) => mostrarErrorInterno('interfaz', evento.error || evento.message));

  const formatearEuros = (importe) =>
    Number(importe || 0).toLocaleString('es-ES', { style: 'currency', currency: 'EUR' });

  // Fecha local en YYYY-MM-DD (no toISOString, que devuelve UTC y desplaza el día de madrugada).
  const fechaLocalISO = (fecha) => {
    const mes = String(fecha.getMonth() + 1).padStart(2, '0');
    const dia = String(fecha.getDate()).padStart(2, '0');
    return `${fecha.getFullYear()}-${mes}-${dia}`;
  };

  const inicializarFormularioReserva = () => {
    const selEspacio = $('campo-espacio');
    if (!selEspacio) return;

    const hoy = fechaLocalISO(new Date());
    ['campo-fecha-unica', 'campo-fecha-entrada', 'campo-fecha-salida'].forEach((id) => {
      $(id).min = hoy;
    });

    selEspacio.addEventListener('change', alCambiarEspacio);
    $('campo-canal').addEventListener('change', alCambiarCanal);
    $('campo-comision').addEventListener('input', recalcularImportes);
    $('campo-importe-alquiler').addEventListener('input', recalcularImportes);
    $('form-reserva').addEventListener('submit', alEnviarFormulario);
    cargarEspacios();
  };

  const cargarEspacios = () => {
    google.script.run
      .withSuccessHandler((res) => {
        if (!res.success) { mostrarMensaje(res.error, 'error'); return; }
        espaciosCatalogo = res.data;
        const sel = $('campo-espacio');
        res.data.forEach((esp) => {
          const opt = document.createElement('option');
          opt.value = esp.nombre;
          opt.textContent = esp.nombre;
          sel.appendChild(opt);
        });
      })
      .withFailureHandler(() => mostrarMensaje('No se pudieron cargar los espacios. Inténtalo de nuevo.', 'error'))
      .cargarEspaciosFormulario();
  };

  const alCambiarEspacio = (evento) => {
    const nombre = evento.target.value;
    resetearCamposDependientes();
    if (!nombre) { $('bloque-dependiente').hidden = true; return; }

    const espacio = espaciosCatalogo.find((esp) => esp.nombre === nombre);
    mostrarCamposFecha(espacio ? espacio.modoFecha : '');
    prerrellenarHoras(espacio ? espacio.horasPorDefecto : null);
    $('bloque-dependiente').hidden = false;
    cargarOpcionesDeEspacio(nombre);
  };

  const cargarOpcionesDeEspacio = (espacio) => {
    servidor('Cargando las opciones del espacio…')
      .withSuccessHandler((res) => {
        if (!res.success) { mostrarMensaje(res.error, 'error'); return; }
        rellenarCanales(res.data.canales);
        rellenarServicios(res.data.servicios);
      })
      .withFailureHandler(() => mostrarMensaje('No se pudieron cargar las opciones del espacio. Inténtalo de nuevo.', 'error'))
      .cargarOpcionesEspacio(espacio);
  };

  const rellenarCanales = (canales) => {
    canalesCatalogo = canales;
    const sel = $('campo-canal');
    sel.length = 1;
    canales.forEach((canal) => {
      const opt = document.createElement('option');
      opt.value = canal.nombre;
      opt.textContent = canal.nombre;
      sel.appendChild(opt);
    });
    $('ayuda-canal').hidden = canales.length > 0;
  };

  const alCambiarCanal = (evento) => {
    const canal = canalesCatalogo.find((c) => c.nombre === evento.target.value);
    $('campo-comision').value = (canal && canal.comision !== '') ? canal.comision : '';
    costeFijoCanal = (canal && canal.costeFijo) ? canal.costeFijo : 0;
    mostrarRefCanal(canal);
    recalcularImportes();
  };

  // RF-88: el código de la plataforma; obligatorio solo en los canales que lo exigen en el catálogo.
  const mostrarRefCanal = (canal) => {
    $('grupo-ref-canal').hidden = !canal;
    $('ref-canal-nombre').textContent = canal ? canal.nombre : '';
    $('ref-canal-obligatorio').hidden = !(canal && canal.requiereRef);
  };

  const rellenarServicios = (servicios) => {
    const contenedor = $('lista-servicios');
    contenedor.innerHTML = '';
    servicios.forEach((servicio, indice) => contenedor.appendChild(crearItemServicio(servicio, indice)));
    $('ayuda-servicios').hidden = servicios.length > 0;
    recalcularImportes();
  };

  const crearItemServicio = (servicio, indice) => {
    const item = document.createElement('div');
    item.className = 'servicio-item';
    const idCheck = 'srv-' + indice;

    const check = document.createElement('input');
    check.type = 'checkbox';
    check.id = idCheck;
    check.value = servicio.nombre;
    check.dataset.coste = servicio.costeUnitario;
    check.dataset.precio = servicio.precioUnitario;

    const label = document.createElement('label');
    label.setAttribute('for', idCheck);
    label.className = 'servicio-nombre';
    label.textContent = servicio.nombre + ' · ' + formatearEuros(servicio.precioUnitario) + '/ud';

    const cantidad = document.createElement('input');
    cantidad.type = 'number';
    cantidad.className = 'servicio-cantidad';
    cantidad.min = '1';
    cantidad.step = '1';
    cantidad.value = '1';
    cantidad.hidden = true;
    cantidad.setAttribute('aria-label', 'Cantidad de ' + servicio.nombre);

    check.addEventListener('change', () => {
      cantidad.hidden = !check.checked;
      recalcularImportes();
    });
    cantidad.addEventListener('input', recalcularImportes);

    item.append(check, label, cantidad);
    return item;
  };

  const recalcularImportes = () => {
    const alquiler = parseFloat($('campo-importe-alquiler').value) || 0;
    const comisionPct = parseFloat($('campo-comision').value) || 0;

    let serviciosPrecio = 0;
    let serviciosCoste = 0;
    document.querySelectorAll('#lista-servicios .servicio-item').forEach((item) => {
      const check = item.querySelector('input[type="checkbox"]');
      if (!check.checked) return;
      const cantidad = parseInt(item.querySelector('.servicio-cantidad').value, 10) || 0;
      serviciosPrecio += cantidad * (parseFloat(check.dataset.precio) || 0);
      serviciosCoste += cantidad * (parseFloat(check.dataset.coste) || 0);
    });

    const bruto = alquiler + serviciosPrecio;
    const comision = bruto * (comisionPct / 100);
    const neto = bruto - comision - serviciosCoste - costeFijoCanal;

    $('res-alquiler').textContent = formatearEuros(alquiler);
    $('res-servicios').textContent = formatearEuros(serviciosPrecio);
    $('res-bruto').textContent = formatearEuros(bruto);
    $('res-comision').textContent = '−' + formatearEuros(comision);
    $('res-coste').textContent = '−' + formatearEuros(serviciosCoste);
    const fijoWrap = $('res-fijo-wrap');
    if (fijoWrap) {
      fijoWrap.hidden = costeFijoCanal === 0;
      $('res-fijo').textContent = '−' + formatearEuros(costeFijoCanal);
    }
    $('res-neto').textContent = formatearEuros(neto);
  };

  const mostrarCamposFecha = (modo) => {
    $('fechas-dia-hora').hidden = modo !== 'Dia_y_Hora';
    $('fechas-rango').hidden = modo !== 'Rango_Dias';
    $('horas-reserva').hidden = !modo;
  };

  // F-23: en los espacios por días, las horas llegan rellenas con las de Config y se pueden cambiar.
  const prerrellenarHoras = (horas) => {
    $('campo-hora-llegada').value = horas ? horas.llegada : '';
    $('campo-hora-salida').value = horas ? horas.salida : '';
  };

  const resetearCamposDependientes = () => {
    $('campo-canal').selectedIndex = 0;
    $('campo-comision').value = '';
    $('campo-ref-canal').value = '';
    mostrarRefCanal(null);
    costeFijoCanal = 0;
    $('lista-servicios').innerHTML = '';
    $('ayuda-servicios').hidden = true;
    $('ayuda-canal').hidden = true;
    ['campo-fecha-unica', 'campo-hora-llegada', 'campo-hora-salida', 'campo-fecha-entrada', 'campo-fecha-salida']
      .forEach((id) => { $(id).value = ''; });
    limpiarErrores();
    recalcularImportes();
  };

  const alEnviarFormulario = (evento) => {
    evento.preventDefault();
    limpiarErrores();
    const errores = validarFormulario();
    if (errores.length > 0) {
      errores.forEach((err) => marcarError(err.campo, err.mensaje));
      mostrarMensaje('Revisa los campos marcados.', 'error');
      return;
    }
    enviarReserva();
  };

  const enviarReserva = () => {
    const boton = $('btn-guardar-reserva');
    boton.disabled = true;
    servidor('Guardando la reserva…')
      .withSuccessHandler((res) => {
        boton.disabled = false;
        if (!res.success) { mostrarMensaje(res.error, 'error'); return; }
        if (res.aviso) mostrarAvisoConIncidencia('Reserva ' + res.id + ': ' + res.aviso, res.incidencia);
        else mostrarMensaje('Reserva ' + res.id + ' guardada correctamente.', 'exito');
        reiniciarFormulario();
      })
      .withFailureHandler(() => {
        boton.disabled = false;
        mostrarMensaje('Error inesperado al guardar. Inténtalo de nuevo.', 'error');
      })
      .crearReserva(obtenerDatosFormulario());
  };

  const obtenerServiciosSeleccionados = () => {
    const seleccionados = [];
    document.querySelectorAll('#lista-servicios .servicio-item').forEach((item) => {
      const check = item.querySelector('input[type="checkbox"]');
      if (!check.checked) return;
      seleccionados.push({ nombre: check.value, cantidad: item.querySelector('.servicio-cantidad').value });
    });
    return seleccionados;
  };

  const obtenerDatosFormulario = () => ({
    espacio: $('campo-espacio').value,
    canal: $('campo-canal').value,
    comision: $('campo-comision').value,
    refCanal: $('campo-ref-canal').value.trim(),
    fechaUnica: $('campo-fecha-unica').value,
    horaLlegada: $('campo-hora-llegada').value,
    horaSalida: $('campo-hora-salida').value,
    fechaEntrada: $('campo-fecha-entrada').value,
    fechaSalida: $('campo-fecha-salida').value,
    adultos: $('campo-adultos').value,
    menores: $('campo-menores').value,
    importeAlquiler: $('campo-importe-alquiler').value,
    nombre: $('campo-nombre').value.trim(),
    telefono: $('campo-telefono').value.trim(),
    email: $('campo-email').value.trim(),
    servicios: obtenerServiciosSeleccionados(),
  });

  const reiniciarFormulario = () => {
    $('form-reserva').reset();
    $('campo-espacio').selectedIndex = 0;
    resetearCamposDependientes();
    $('bloque-dependiente').hidden = true;
  };

  const validarFormulario = () => {
    const errores = [];
    const espacio = $('campo-espacio').value;
    if (!espacio) errores.push({ campo: 'campo-espacio', mensaje: 'Selecciona un espacio.' });
    if (!$('campo-canal').value) errores.push({ campo: 'campo-canal', mensaje: 'Selecciona un canal.' });
    const canal = canalesCatalogo.find((c) => c.nombre === $('campo-canal').value);
    if (canal && canal.requiereRef && !$('campo-ref-canal').value.trim()) {
      errores.push({ campo: 'campo-ref-canal', mensaje: `Indica el código de reserva de ${canal.nombre}.` });
    }

    const datosEspacio = espaciosCatalogo.find((esp) => esp.nombre === espacio);
    const modo = datosEspacio ? datosEspacio.modoFecha : '';
    if (modo === 'Dia_y_Hora' && !$('campo-fecha-unica').value) {
      errores.push({ campo: 'campo-fecha-unica', mensaje: 'Indica la fecha.' });
    }
    if (modo === 'Rango_Dias') {
      if (!$('campo-fecha-entrada').value) errores.push({ campo: 'campo-fecha-entrada', mensaje: 'Indica la fecha de entrada.' });
      if (!$('campo-fecha-salida').value) errores.push({ campo: 'campo-fecha-salida', mensaje: 'Indica la fecha de salida.' });
    }
    if (modo && !$('campo-hora-llegada').value) errores.push({ campo: 'campo-hora-llegada', mensaje: 'Indica la hora de llegada.' });
    if (modo && !$('campo-hora-salida').value) errores.push({ campo: 'campo-hora-salida', mensaje: 'Indica la hora de salida.' });

    const importeAlquiler = $('campo-importe-alquiler').value.trim();
    if (importeAlquiler === '' || parseFloat(importeAlquiler) < 0) {
      errores.push({ campo: 'campo-importe-alquiler', mensaje: 'Indica el importe del alquiler.' });
    }

    const adultos = parseInt($('campo-adultos').value, 10);
    if (!(adultos >= 1)) errores.push({ campo: 'campo-adultos', mensaje: 'Debe haber al menos 1 adulto.' });

    if (!$('campo-nombre').value.trim()) errores.push({ campo: 'campo-nombre', mensaje: 'El nombre del huésped es obligatorio.' });

    const telefono = $('campo-telefono').value.trim();
    if (telefono && !RE_TELEFONO.test(telefono)) errores.push({ campo: 'campo-telefono', mensaje: 'El teléfono debe tener 9 cifras.' });

    const email = $('campo-email').value.trim();
    if (email && !RE_EMAIL.test(email)) errores.push({ campo: 'campo-email', mensaje: 'Email con formato no válido (usuario@dominio.com).' });

    return errores;
  };

  const marcarError = (idCampo, mensaje) => {
    const campo = $(idCampo);
    if (!campo) return;
    campo.classList.add('invalido');
    let error = campo.parentNode.querySelector('.error-campo');
    if (!error) {
      error = document.createElement('p');
      error.className = 'error-campo';
      campo.parentNode.appendChild(error);
    }
    error.textContent = mensaje;
  };

  const limpiarErrores = () => {
    document.querySelectorAll('#form-reserva .invalido').forEach((el) => el.classList.remove('invalido'));
    document.querySelectorAll('#form-reserva .error-campo').forEach((el) => el.remove());
  };

  // ----- Mensajes al usuario (F-21) -----
  // Éxito: aviso centrado que se cierra solo. Error y aviso: ventana que el usuario debe cerrar, para que no pase desapercibida.
  const DURACION_EXITO_MS = 3500;
  let temporizadorExito = null;

  const mostrarExito = (texto) => {
    let aviso = $('toast-global');
    if (!aviso) {
      aviso = document.createElement('div');
      aviso.id = 'toast-global';
      aviso.setAttribute('role', 'status');
      aviso.setAttribute('aria-live', 'polite');
      document.body.appendChild(aviso);
    }
    aviso.className = 'toast toast-exito';
    aviso.textContent = texto;
    aviso.style.display = 'block';
    if (temporizadorExito) clearTimeout(temporizadorExito);
    temporizadorExito = setTimeout(() => { aviso.style.display = 'none'; }, DURACION_EXITO_MS);
  };

  // Ventana modal accesible (CLAUDE.md §6.5): rol de diálogo, foco dentro, Tab no se escapa y Escape cierra.
  // botones: [{ texto, clase, alPulsar, cierra = true }]; el primero recibe el foco (la opción segura).
  const crearDialogo = ({ titulo, texto, tipo = 'info', botones }) => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    const modal = document.createElement('div');
    modal.className = 'modal modal-' + tipo;
    modal.setAttribute('role', tipo === 'info' ? 'dialog' : 'alertdialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-labelledby', 'modal-titulo');
    modal.setAttribute('aria-describedby', 'modal-texto');
    const cabecera = document.createElement('h3');
    cabecera.id = 'modal-titulo';
    cabecera.textContent = titulo;
    const parrafo = document.createElement('p');
    parrafo.id = 'modal-texto';
    parrafo.textContent = texto;
    const acciones = document.createElement('div');
    acciones.className = 'form-acciones';
    const origen = document.activeElement;
    const cerrar = () => { overlay.remove(); if (origen) origen.focus(); };
    const elementos = botones.map(({ texto: etiqueta, clase = 'btn-secundario', alPulsar, cierra = true }) => {
      const boton = document.createElement('button');
      boton.type = 'button';
      boton.className = 'btn ' + clase;
      boton.textContent = etiqueta;
      boton.addEventListener('click', () => { if (cierra) cerrar(); if (alPulsar) alPulsar(boton); });
      return boton;
    });
    overlay.addEventListener('keydown', (evento) => {
      if (evento.key === 'Escape') { cerrar(); return; }
      if (evento.key !== 'Tab') return;
      const primero = elementos[0];
      const ultimo = elementos[elementos.length - 1];
      if (evento.shiftKey && document.activeElement === primero) { evento.preventDefault(); ultimo.focus(); }
      else if (!evento.shiftKey && document.activeElement === ultimo) { evento.preventDefault(); primero.focus(); }
    });
    acciones.append(...elementos);
    modal.append(cabecera, parrafo, acciones);
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    elementos[0].focus();
    return cerrar;
  };

  const TITULOS_DIALOGO = { error: 'No se ha podido completar', aviso: 'Atención' };

  // Punto único de feedback de toda la app: 'exito' se cierra solo; 'error' y 'aviso' exigen cerrarlos.
  const mostrarMensaje = (texto, tipo) => {
    if (tipo === 'exito') { mostrarExito(texto); return; }
    const clase = tipo === 'aviso' ? 'aviso' : 'error';
    crearDialogo({ titulo: TITULOS_DIALOGO[clase], texto, tipo: clase, botones: [{ texto: 'Entendido', clase: 'btn-primario' }] });
  };

  // Aviso con opción de mandar a los administradores el detalle técnico del error (F-21).
  const mostrarAvisoConIncidencia = (texto, incidencia) => {
    const enviar = (boton) => {
      boton.disabled = true;
      boton.textContent = 'Enviando…';
      servidor('Enviando la incidencia…')
        .withSuccessHandler((res) => {
          if (!res.success) { boton.disabled = false; boton.textContent = 'Enviar al administrador'; mostrarMensaje(res.error, 'error'); return; }
          cerrar();
          mostrarExito('Incidencia enviada al administrador.');
        })
        .withFailureHandler(() => {
          boton.disabled = false;
          boton.textContent = 'Enviar al administrador';
          mostrarMensaje('No se pudo enviar la incidencia. Inténtalo más tarde.', 'error');
        })
        .notificarIncidencia(incidencia);
    };
    const cerrar = crearDialogo({
      titulo: TITULOS_DIALOGO.aviso, texto, tipo: 'aviso',
      botones: [
        { texto: 'Entendido', clase: 'btn-secundario' },
        { texto: 'Enviar al administrador', clase: 'btn-primario', cierra: false, alPulsar: enviar },
      ],
    });
  };

  const confirmarAccion = (texto, onConfirm) => crearDialogo({
    titulo: 'Confirmar', texto,
    botones: [
      { texto: 'No, volver', clase: 'btn-secundario' },
      { texto: 'Sí, continuar', clase: 'btn-primario', alPulsar: onConfirm },
    ],
  });

  // ----- Tarjeta de reserva (F-36, DI-22): en el móvil nada se desplaza en horizontal -----
  // lineas: [{ texto, clase }] o nodos; etiquetas: nodos (badges). Toda la tarjeta es un botón.
  const crearTarjetaReserva = ({ titulo, lineas = [], etiquetas = [], alPulsar }) => {
    const li = document.createElement('li');
    const boton = document.createElement('button');
    boton.type = 'button';
    boton.className = 'tarjeta-reserva';
    const cabecera = document.createElement('span');
    cabecera.className = 'tarjeta-linea tarjeta-titulo';
    cabecera.textContent = titulo;
    boton.appendChild(cabecera);
    lineas.filter(Boolean).forEach((texto) => {
      const linea = document.createElement('span');
      linea.className = 'tarjeta-linea tarjeta-fechas';
      linea.textContent = texto;
      boton.appendChild(linea);
    });
    if (etiquetas.length > 0) {
      const fila = document.createElement('span');
      fila.className = 'tarjeta-linea tarjeta-etiquetas';
      fila.append(...etiquetas);
      boton.appendChild(fila);
    }
    boton.addEventListener('click', alPulsar);
    li.appendChild(boton);
    return li;
  };

  const pintarTarjetas = (lista, elementos, aTarjeta, textoVacio) => {
    lista.innerHTML = '';
    if (elementos.length === 0) {
      const vacio = document.createElement('li');
      vacio.className = 'vacio';
      vacio.textContent = textoVacio;
      lista.appendChild(vacio);
      return;
    }
    elementos.forEach((x) => lista.appendChild(aTarjeta(x)));
  };

  // Al tocar una reserva del Inicio se abre su ficha (gestion_interfaz.html).
  const abrirFichaDesdeInicio = (r) => abrirFicha(r.idReserva);

  // ----- Inicio: reservas de un vistazo (HU-04, F-32), con "Ordenar por" en lugar de columnas (DI-22) -----
  let ultimasReservas = [];
  const TEXTO_VACIO_VISTAZO = { proximas: 'No hay reservas próximas.', ultimas: 'Todavía no hay reservas.' };
  const ORDENES_VISTAZO = {
    'entrada-asc': (a, b) => a.inicioOrden - b.inicioOrden,
    'entrada-desc': (a, b) => b.inicioOrden - a.inicioOrden,
    'nombre-asc': (a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'),
    'neto-desc': (a, b) => b.neto - a.neto,
  };

  const tarjetaVistazo = (r) => crearTarjetaReserva({
    titulo: `${r.ref} · ${r.nombre}`,
    lineas: [`${r.espacio}${r.refCanal ? ' · ' + r.refCanal : ''}`, `${r.inicioTexto} → ${r.finTexto}`, `Neto: ${formatearEuros(r.neto)}`],
    alPulsar: () => abrirFichaDesdeInicio(r),
  });

  const renderUltimas = () => {
    const ordenadas = [...ultimasReservas].sort(ORDENES_VISTAZO[$('vistazo-orden').value]);
    pintarTarjetas($('lista-vistazo'), ordenadas, tarjetaVistazo, TEXTO_VACIO_VISTAZO[$('vistazo-modo').value]);
  };

  const cargarVistazo = () => {
    servidor('Cargando las reservas…')
      .withSuccessHandler((res) => {
        if (!res.success) { pintarTarjetas($('lista-vistazo'), [], tarjetaVistazo, res.error); return; }
        ultimasReservas = res.data;
        renderUltimas();
      })
      .withFailureHandler(() => pintarTarjetas($('lista-vistazo'), [], tarjetaVistazo, 'No se pudieron cargar las reservas.'))
      .cargarReservasVistazo($('vistazo-modo').value);
  };

  const inicializarInicio = () => {
    $('vistazo-modo').addEventListener('change', cargarVistazo);
    $('vistazo-orden').addEventListener('change', renderUltimas);
    cargarVistazo();
  };

  // ----- Buscar Reserva (HU-06) -----
  const tarjetaBusqueda = (r) => crearTarjetaReserva({
    titulo: `${r.id} · ${r.nombre}`,
    lineas: [r.espacio, `${r.inicioTexto} → ${r.finTexto}`],
    alPulsar: () => abrirFichaDesdeInicio(r),
  });

  const renderBusqueda = (reservas) => pintarTarjetas($('lista-busqueda'), reservas, tarjetaBusqueda, 'Ninguna reserva coincide con ese nombre o fecha.');

  const ejecutarBusqueda = () => {
    const boton = $('btn-buscar');
    boton.disabled = true;
    servidor('Buscando reservas…')
      .withSuccessHandler((res) => {
        boton.disabled = false;
        if (!res.success) { mostrarMensaje(res.error, 'error'); return; }
        renderBusqueda(res.data);
      })
      .withFailureHandler(() => { boton.disabled = false; mostrarMensaje('No se pudo buscar. Inténtalo de nuevo.', 'error'); })
      .buscarReservas({ nombre: $('buscar-nombre').value.trim(), fecha: $('buscar-fecha').value });
  };

  const inicializarBuscar = () => {
    const boton = $('btn-buscar');
    if (boton) boton.addEventListener('click', ejecutarBusqueda);
  };

  inicializarNavegacion();
  inicializarFormularioReserva();
  inicializarInicio();
  inicializarBuscar();
</script>
