  <script>
    // Checklists de check-in y check-out (F-14, DD-01) dentro de Gestionar → Modificar, y editor del catálogo (Admin).
    // Reutiliza $, mostrarMensaje, mostrarExito, confirmarAccion, leerArchivo y modificar de cliente/gestion (mismo ámbito).

    const MOMENTOS_CHECKLIST_UI = [
      { momento: 'Check-in', titulo: 'Check-in', video: 'In' },
      { momento: 'Check-out', titulo: 'Check-out', video: 'Out' },
    ];
    const ESTADOS = { HECHO: 'Hecho', NO_APLICA: 'No aplica', PENDIENTE: 'Pendiente' };
    const RESPUESTAS_DANOS = ['Sin daños', 'Con daños'];
    const MAX_MB_VIDEO_CLIENTE = 100;

    let checklistReservaId = null;

    const cargarChecklistsReserva = (id) => {
      checklistReservaId = id;
      const cont = $('checklists-reserva');
      cont.innerHTML = '';
      MOMENTOS_CHECKLIST_UI.forEach((m) => {
        const det = document.createElement('details');
        det.className = 'checklist';
        const resumen = document.createElement('summary');
        resumen.textContent = `${m.titulo} — cargando…`;
        det.appendChild(resumen);
        cont.appendChild(det);
        pedirChecklist(m, det);
      });
    };

    const pedirChecklist = (m, det) => {
      servidor('Cargando la checklist…')
        .withSuccessHandler((res) => {
          if (!res.success) { det.querySelector('summary').textContent = `${m.titulo} — no se pudo cargar`; mostrarMensaje(res.error, 'error'); return; }
          renderChecklist(m, det, res.data);
        })
        .withFailureHandler(() => mostrarMensaje('No se pudo cargar la checklist. Recarga la página.', 'error'))
        .cargarChecklist(checklistReservaId, m.momento);
    };

    const puntoResueltoUI = (p) => {
      if (p.tipo === 'Foto') return true;
      if (p.tipo === 'Daños') return p.estado === ESTADOS.HECHO && RESPUESTAS_DANOS.includes(p.valor);
      if (p.estado === ESTADOS.NO_APLICA) return true;
      return p.estado === ESTADOS.HECHO && (p.tipo !== 'Fecha' || Boolean(p.valor));
    };

    const renderChecklist = (m, det, data) => {
      const abierta = det.open;
      det.innerHTML = '';
      const puntos = data.bloques.flatMap((b) => b.puntos);
      const resumen = document.createElement('summary');
      const actualizarResumen = () => {
        const hechos = puntos.filter(puntoResueltoUI).length;
        resumen.textContent = `${m.titulo} — ${hechos} de ${puntos.length}${data.confirmada ? ' · Terminado ✓' : ''}`;
        botonTerminar.disabled = hechos < puntos.length;
      };
      det.appendChild(resumen);

      data.bloques.forEach((bloque) => {
        const titulo = document.createElement('h4');
        titulo.className = 'checklist-bloque';
        titulo.textContent = bloque.nombre;
        det.appendChild(titulo);
        bloque.puntos.forEach((p) => det.appendChild(filaPunto(m, p, () => actualizarResumen())));
      });

      const obs = document.createElement('textarea');
      obs.rows = 2;
      obs.id = `checklist-obs-${m.video}`;
      obs.value = data.observaciones || '';
      const obsLabel = document.createElement('label');
      obsLabel.htmlFor = obs.id;
      obsLabel.textContent = 'Observaciones';
      const grupoObs = document.createElement('div');
      grupoObs.className = 'form-grupo';
      grupoObs.append(obsLabel, obs);
      det.appendChild(grupoObs);

      const acciones = document.createElement('div');
      acciones.className = 'form-acciones';
      const botonGuardar = document.createElement('button');
      botonGuardar.type = 'button';
      botonGuardar.className = 'btn btn-secundario';
      botonGuardar.textContent = 'Guardar checklist';
      const botonTerminar = document.createElement('button');
      botonTerminar.type = 'button';
      botonTerminar.className = 'btn btn-primario';
      botonTerminar.textContent = `Dar el ${m.titulo.toLowerCase()} por terminado`;
      botonGuardar.addEventListener('click', () => guardarChecklistUI(m, puntos, obs.value, botonGuardar, (res) => {
        if (!res.reabierta) { mostrarExito('Checklist guardada.'); return; }
        reabrirDetalle();
        mostrarMensaje(`Checklist guardada. El ${m.titulo.toLowerCase()} ya no está terminado: quedan puntos pendientes.`, 'aviso');
      }));
      botonTerminar.addEventListener('click', () => confirmarAccion(
        `¿Das el ${m.titulo.toLowerCase()} por terminado? Quedará registrado a tu nombre.`,
        () => guardarChecklistUI(m, puntos, obs.value, botonTerminar, () => terminarChecklistUI(m, puntos)),
      ));
      acciones.append(botonGuardar, botonTerminar);
      det.appendChild(acciones);
      det.open = abierta;
      actualizarResumen();
    };

    // Una fila por punto: control según su tipo + botón "No aplica".
    const filaPunto = (m, p, alCambiar) => {
      const fila = document.createElement('div');
      fila.className = 'checklist-punto';
      const principal = document.createElement('div');
      principal.className = 'checklist-control';
      const noAplica = document.createElement('button');
      noAplica.type = 'button';
      noAplica.className = 'btn btn-secundario btn-pequeno btn-no-aplica';
      noAplica.textContent = 'No aplica';
      const refrescarNoAplica = () => {
        noAplica.setAttribute('aria-pressed', String(p.estado === ESTADOS.NO_APLICA));
        fila.classList.toggle('no-aplica', p.estado === ESTADOS.NO_APLICA);
      };

      if (p.tipo === 'Casilla') {
        const check = document.createElement('input');
        check.type = 'checkbox';
        check.id = `punto-${p.id}`;
        check.checked = p.estado === ESTADOS.HECHO;
        const etiqueta = document.createElement('label');
        etiqueta.htmlFor = check.id;
        etiqueta.textContent = p.punto;
        check.addEventListener('change', () => { p.estado = check.checked ? ESTADOS.HECHO : ESTADOS.PENDIENTE; refrescarNoAplica(); alCambiar(); });
        noAplica.addEventListener('click', () => { check.checked = false; });
        principal.append(check, etiqueta);
      } else if (p.tipo === 'Daños') {
        principal.appendChild(controlDanos(p, alCambiar));
      } else if (p.tipo === 'Fecha') {
        const fecha = document.createElement('input');
        fecha.type = 'date';
        fecha.id = `punto-${p.id}`;
        fecha.value = p.valor || '';
        const etiqueta = document.createElement('label');
        etiqueta.htmlFor = fecha.id;
        etiqueta.textContent = `${p.punto} — día`;
        fecha.addEventListener('change', () => { p.valor = fecha.value; p.estado = fecha.value ? ESTADOS.HECHO : ESTADOS.PENDIENTE; refrescarNoAplica(); alCambiar(); });
        principal.append(etiqueta, fecha);
      } else {
        principal.appendChild(controlArchivo(m, p, alCambiar, refrescarNoAplica));
      }

      noAplica.addEventListener('click', () => {
        p.estado = p.estado === ESTADOS.NO_APLICA ? ESTADOS.PENDIENTE : ESTADOS.NO_APLICA;
        refrescarNoAplica();
        alCambiar();
      });
      refrescarNoAplica();
      fila.append(principal);
      if (p.tipo !== 'Foto' && p.tipo !== 'Daños') fila.append(noAplica);
      return fila;
    };

    // B-19: dos opciones excluyentes; cualquiera completa el punto y "Con daños" lleva a registrar la incidencia.
    const controlDanos = (p, alCambiar) => {
      const grupo = document.createElement('fieldset');
      grupo.className = 'checklist-danos';
      const leyenda = document.createElement('legend');
      leyenda.textContent = p.punto;
      grupo.appendChild(leyenda);
      RESPUESTAS_DANOS.forEach((respuesta, i) => {
        const opcion = document.createElement('input');
        opcion.type = 'radio';
        opcion.name = `punto-${p.id}`;
        opcion.id = `punto-${p.id}-${i}`;
        opcion.checked = p.valor === respuesta;
        opcion.addEventListener('change', () => { p.valor = respuesta; p.estado = ESTADOS.HECHO; alCambiar(); });
        const etiqueta = document.createElement('label');
        etiqueta.htmlFor = opcion.id;
        etiqueta.textContent = respuesta;
        grupo.append(opcion, etiqueta);
      });
      return grupo;
    };

    // Vídeo (se marca solo al subirlo) o fotos de desperfectos (opcionales, se van añadiendo).
    const controlArchivo = (m, p, alCambiar, refrescarNoAplica) => {
      const caja = document.createElement('div');
      const etiqueta = document.createElement('span');
      etiqueta.className = 'etiqueta-bloque';
      etiqueta.textContent = p.punto;
      const estado = document.createElement('p');
      estado.className = 'ayuda-campo';
      const pintarEstado = () => { estado.textContent = p.valor ? `Subido${p.tipo === 'Foto' ? `: ${p.valor.split(' | ').length} foto(s)` : ''}.` : 'Pendiente de subir.'; };
      const input = document.createElement('input');
      input.type = 'file';
      input.id = `punto-${p.id}`;
      input.accept = p.tipo === 'Video' ? 'video/*' : 'image/*';
      const boton = document.createElement('button');
      boton.type = 'button';
      boton.className = 'btn btn-secundario';
      boton.textContent = p.tipo === 'Video' ? 'Subir vídeo' : 'Añadir foto';
      boton.addEventListener('click', () => leerArchivo(input, (archivo) => {
        boton.disabled = true;
        const alTerminar = (res) => {
          boton.disabled = false;
          if (!res.success) { mostrarMensaje(res.error, 'error'); return; }
          p.estado = ESTADOS.HECHO;
          p.valor = p.tipo === 'Foto' && p.valor ? `${p.valor} | ${res.url}` : res.url;
          pintarEstado();
          refrescarNoAplica();
          alCambiar();
          mostrarExito(p.tipo === 'Video' ? 'Vídeo subido.' : 'Foto añadida.');
        };
        const runner = servidor(p.tipo === 'Video' ? 'Subiendo el vídeo…' : 'Subiendo la foto…').withSuccessHandler(alTerminar)
          .withFailureHandler(() => { boton.disabled = false; mostrarMensaje('No se pudo subir el archivo. Inténtalo de nuevo.', 'error'); });
        if (p.tipo === 'Video') runner.subirVideo(checklistReservaId, m.video, archivo);
        else runner.subirFotoDesperfecto(checklistReservaId, archivo);
      }, p.tipo === 'Video' ? { maxMB: MAX_MB_VIDEO_CLIENTE } : undefined));
      pintarEstado();
      caja.append(etiqueta, estado, input, boton);
      return caja;
    };

    const estadosParaGuardar = (puntos) => puntos
      .filter((p) => p.tipo !== 'Foto')
      .map((p) => ({ idPunto: p.id, estado: p.estado, valor: p.tipo === 'Fecha' || p.tipo === 'Daños' ? (p.valor || '') : '' }));

    const guardarChecklistUI = (m, puntos, observaciones, boton, alGuardar) => {
      boton.disabled = true;
      servidor('Guardando la checklist…')
        .withSuccessHandler((res) => {
          boton.disabled = false;
          if (!res.success) { mostrarMensaje(res.error, 'error'); return; }
          alGuardar(res);
        })
        .withFailureHandler(() => { boton.disabled = false; mostrarMensaje('No se pudo guardar la checklist.', 'error'); })
        .guardarChecklist(checklistReservaId, m.momento, estadosParaGuardar(puntos), observaciones);
    };

    // Si algún punto de daños se respondió "Con daños", se lleva al usuario a registrar la incidencia (B-19).
    const hayDanos = (puntos) => puntos.some((p) => p.tipo === 'Daños' && p.valor === 'Con daños');

    // Vuelve a abrir la reserva para ver su estado recalculado.
    const reabrirDetalle = () => {
      const id = checklistReservaId;
      cerrarDetalle();
      modificar(id);
    };

    const terminarChecklistUI = (m, puntos) => {
      servidor('Terminando la checklist…')
        .withSuccessHandler((res) => {
          if (!res.success) { mostrarMensaje(res.error, 'error'); return; }
          mostrarExito(`${m.titulo} terminado.`);
          reabrirDetalle();
          if (m.momento === 'Check-out' && hayDanos(puntos)) {
            mostrarMensaje('Has indicado daños. Registra la incidencia en el formulario: Incidencias → "Con incidentes".', 'aviso');
          }
        })
        .withFailureHandler(() => mostrarMensaje('No se pudo terminar la checklist.', 'error'))
        .confirmarChecklist(checklistReservaId, m.momento);
    };

    // ----- Editor del catálogo (solo Admin, DD-01 §3.3) -----
    const cargarPerfil = () => {
      google.script.run
        .withSuccessHandler((res) => {
          if (res.success && res.data.esAdmin) $('btn-nav-checklists').hidden = false;
        })
        .withFailureHandler(() => {})
        .obtenerPerfil();
    };

    const cargarEditorChecklist = () => {
      const espacio = $('ck-espacio').value;
      const momento = $('ck-momento').value;
      if (!espacio) return;
      const cont = $('ck-lista');
      cont.textContent = 'Cargando…';
      servidor('Cargando el catálogo…')
        .withSuccessHandler((res) => {
          if (!res.success) { cont.textContent = ''; mostrarMensaje(res.error, 'error'); return; }
          renderEditor(res.data, espacio, momento);
        })
        .withFailureHandler(() => { cont.textContent = ''; mostrarMensaje('No se pudo cargar el catálogo.', 'error'); })
        .cargarCatalogoChecklist(espacio, momento);
    };

    const guardarPuntoUI = (datos, boton) => {
      if (boton) boton.disabled = true;
      servidor('Guardando el punto…')
        .withSuccessHandler((res) => {
          if (boton) boton.disabled = false;
          if (!res.success) { mostrarMensaje(res.error, 'error'); return; }
          mostrarExito('Checklist actualizada.');
          cargarEditorChecklist();
        })
        .withFailureHandler(() => { if (boton) boton.disabled = false; mostrarMensaje('No se pudo guardar el punto.', 'error'); })
        .guardarPuntoChecklist(datos);
    };

    const campoTexto = (valor, etiquetaAccesible) => {
      const input = document.createElement('input');
      input.type = 'text';
      input.value = valor;
      input.setAttribute('aria-label', etiquetaAccesible);
      return input;
    };

    const renderEditor = (puntos, espacio, momento) => {
      const cont = $('ck-lista');
      cont.innerHTML = '';
      const bloques = [...new Set(puntos.map((p) => p.bloque))];
      bloques.forEach((nombre) => {
        const titulo = document.createElement('h4');
        titulo.className = 'checklist-bloque';
        titulo.textContent = nombre;
        cont.appendChild(titulo);
        puntos.filter((p) => p.bloque === nombre).forEach((p) => {
          const fila = document.createElement('div');
          fila.className = 'checklist-punto' + (p.activo === 'No' ? ' no-aplica' : '');
          const texto = campoTexto(p.punto, `Texto del punto ${p.id}`);
          const guardar = document.createElement('button');
          guardar.type = 'button';
          guardar.className = 'btn btn-secundario btn-pequeno';
          guardar.textContent = 'Guardar';
          guardar.addEventListener('click', () => guardarPuntoUI({ id: p.id, punto: texto.value }, guardar));
          const activar = document.createElement('button');
          activar.type = 'button';
          activar.className = 'btn btn-secundario btn-pequeno';
          activar.textContent = p.activo === 'Sí' ? 'Desactivar' : 'Activar';
          activar.addEventListener('click', () => guardarPuntoUI({ id: p.id, activo: p.activo === 'Sí' ? 'No' : 'Sí' }, activar));
          fila.append(texto, guardar, activar);
          cont.appendChild(fila);
        });
        cont.appendChild(filaNuevoPunto(espacio, momento, nombre));
      });
      const nuevoBloque = document.createElement('div');
      nuevoBloque.className = 'campo-fila';
      const nombreBloque = campoTexto('', 'Nombre del bloque nuevo');
      nombreBloque.placeholder = 'Bloque nuevo';
      const primerPunto = campoTexto('', 'Primer punto del bloque nuevo');
      primerPunto.placeholder = 'Primer punto';
      const crear = document.createElement('button');
      crear.type = 'button';
      crear.className = 'btn btn-primario';
      crear.textContent = 'Crear bloque';
      crear.addEventListener('click', () => guardarPuntoUI({ espacio, momento, bloque: nombreBloque.value, punto: primerPunto.value }, crear));
      nuevoBloque.append(nombreBloque, primerPunto, crear);
      cont.appendChild(nuevoBloque);
    };

    const filaNuevoPunto = (espacio, momento, bloque) => {
      const fila = document.createElement('div');
      fila.className = 'checklist-punto';
      const texto = campoTexto('', `Nuevo punto en ${bloque}`);
      texto.placeholder = `Añadir punto a ${bloque}`;
      const anadir = document.createElement('button');
      anadir.type = 'button';
      anadir.className = 'btn btn-secundario btn-pequeno';
      anadir.textContent = 'Añadir';
      anadir.addEventListener('click', () => guardarPuntoUI({ espacio, momento, bloque, punto: texto.value }, anadir));
      fila.append(texto, anadir);
      return fila;
    };

    const inicializarEditorChecklist = () => {
      google.script.run
        .withSuccessHandler((res) => {
          if (!res.success) return;
          const sel = $('ck-espacio');
          res.data.forEach((e) => { const o = document.createElement('option'); o.value = e.nombre; o.textContent = e.nombre; sel.appendChild(o); });
        })
        .withFailureHandler(() => {})
        .cargarEspaciosFormulario();
      $('ck-espacio').addEventListener('change', cargarEditorChecklist);
      $('ck-momento').addEventListener('change', cargarEditorChecklist);
    };

    cargarPerfil();
    inicializarEditorChecklist();
  </script>
