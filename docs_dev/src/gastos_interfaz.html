<script>
  // Gastos y resumen fiscal (ADR-0012). Reutiliza $, mostrarMensaje, formatearEuros,
  // fechaLocalISO y leerArchivo del resto de scripts de la página.

  let categoriasGasto = [];

  const rellenarOpciones = (select, valores) => {
    valores.forEach((valor) => {
      const opt = document.createElement('option');
      opt.value = valor;
      opt.textContent = valor;
      select.appendChild(opt);
    });
  };

  const cargarCategoriasGasto = () => {
    google.script.run
      .withSuccessHandler((res) => {
        if (!res.success) { mostrarMensaje(res.error, 'error'); return; }
        categoriasGasto = res.data.categorias;
        rellenarOpciones($('ga-categoria'), categoriasGasto.map((c) => c.nombre));
        // Espacios del catálogo + "Común": sin nombres fijos en el HTML (B-10).
        rellenarOpciones($('ga-espacio'), res.data.espacios);
      })
      .withFailureHandler(() => mostrarMensaje('No se pudieron cargar las categorías.', 'error'))
      .cargarCategoriasGasto();
  };

  const alCambiarCategoria = () => {
    const cat = categoriasGasto.find((c) => c.nombre === $('ga-categoria').value);
    $('ga-deducible').value = (cat && !cat.deducibleDefault) ? 'No' : 'Sí';
  };

  const recogerGasto = () => ({
    fecha: $('ga-fecha').value,
    importe: $('ga-importe').value,
    concepto: $('ga-concepto').value.trim(),
    categoria: $('ga-categoria').value,
    espacio: $('ga-espacio').value,
    deducible: $('ga-deducible').value,
    pagadoPor: $('ga-pagado').value.trim(),
    notas: $('ga-notas').value.trim(),
  });

  const guardarGasto = (evento) => {
    evento.preventDefault();
    const datos = recogerGasto();
    if (!datos.fecha || !datos.concepto || !datos.categoria || !datos.espacio || !(Number(datos.importe) > 0)) {
      mostrarMensaje('Completa fecha, concepto, categoría, espacio e importe (mayor que 0).', 'error');
      return;
    }
    const input = $('ga-justificante');
    if (input.files[0]) {
      leerArchivo(input, (archivo) => enviarGasto(datos, archivo));
    } else {
      enviarGasto(datos, null);
    }
  };

  const enviarGasto = (datos, archivo) => {
    const boton = $('btn-guardar-gasto');
    boton.disabled = true;
    servidor('Guardando el gasto…')
      .withSuccessHandler((res) => {
        boton.disabled = false;
        if (!res.success) { mostrarMensaje(res.error, 'error'); return; }
        mostrarMensaje('Gasto ' + res.id + ' guardado.', 'exito');
        $('form-gasto').reset();
        $('ga-fecha').value = fechaLocalISO(new Date());
      })
      .withFailureHandler(() => { boton.disabled = false; mostrarMensaje('No se pudo guardar el gasto.', 'error'); })
      .registrarGasto(datos, archivo);
  };

  const calcularResumen = () => {
    const boton = $('btn-resumen');
    boton.disabled = true;
    servidor('Calculando el resumen fiscal…')
      .withSuccessHandler((res) => {
        boton.disabled = false;
        if (!res.success) { mostrarMensaje(res.error, 'error'); return; }
        renderResumen(res.data);
      })
      .withFailureHandler(() => { boton.disabled = false; mostrarMensaje('No se pudo calcular el resumen.', 'error'); })
      .calcularResumenFiscal($('rf-ejercicio').value);
  };

  // DI-22: sin tablas anchas en el móvil; cada espacio es un bloque de datos.
  const datoResumen = (etiqueta, valor) => {
    const div = document.createElement('div');
    const e = document.createElement('span');
    e.className = 'dato-etq';
    e.textContent = etiqueta;
    const v = document.createElement('span');
    v.className = 'dato-valor';
    v.textContent = valor;
    div.append(e, v);
    return div;
  };

  const bloqueResumen = (titulo, datos) => {
    const seccion = document.createElement('section');
    seccion.className = 'ficha-seccion';
    const h = document.createElement('h3');
    h.textContent = titulo;
    const grid = document.createElement('div');
    grid.className = 'datos-reserva';
    datos.forEach(([etiqueta, valor]) => grid.appendChild(datoResumen(etiqueta, valor)));
    seccion.append(h, grid);
    return seccion;
  };

  const renderResumen = (d) => {
    const cont = $('rf-resultado');
    cont.innerHTML = '';
    d.resumen.forEach((r) => cont.appendChild(bloqueResumen(r.espacio, [
      ['Ingresos íntegros', formatearEuros(r.ingresos)], ['Gastos deducibles', formatearEuros(r.gastosDeducibles)],
      ['Rendimiento neto', formatearEuros(r.rendimiento)], ['Tercio (33,33 %)', formatearEuros(r.tercio)],
    ])));

    const nota = document.createElement('p');
    nota.className = 'ayuda-campo';
    nota.textContent = `Amortización anual estimada: ${formatearEuros(d.amortizacionAnual)} (3% × Valor_Construccion × Proporcion_Alquilada de Config, repartida entre espacios). `
      + 'Incluye comisiones de plataforma como gasto deducible. Reparto a tercios entre los 3 copropietarios. Cifras orientativas, según la normativa del IRPF de alquileres.';
    cont.appendChild(nota);

    if (d.porCategoria.length > 0) {
      cont.appendChild(bloqueResumen('Gastos deducibles por categoría', d.porCategoria.map((c) => [c.categoria, formatearEuros(c.importe)])));
    }
  };

  const inicializarGastos = () => {
    $('ga-fecha').value = fechaLocalISO(new Date());
    $('rf-ejercicio').value = new Date().getFullYear();
    $('ga-categoria').addEventListener('change', alCambiarCategoria);
    $('form-gasto').addEventListener('submit', guardarGasto);
    $('btn-resumen').addEventListener('click', calcularResumen);
    cargarCategoriasGasto();
  };

  inicializarGastos();
</script>
